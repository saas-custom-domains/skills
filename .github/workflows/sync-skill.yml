# The skill is maintained in the docs and published at docs.saascustomdomains.com, which also lists it in
# /.well-known/agent-skills/index.json with its digest. Changes are reviewed there, so this job copies the
# published file here and commits it when it changed.
name: Sync skill

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the published skill
        run: curl -fsSL https://docs.saascustomdomains.com/.well-known/agent-skills/saas-custom-domains/SKILL.md -o skills/saas-custom-domains/SKILL.md

      - name: Commit it if it changed
        run: |
          if git diff --quiet; then
            echo "The skill is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync the skill from docs.saascustomdomains.com"
          git push
